<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="tokens.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--cm-bg); color: var(--cm-text); font-family: var(--cm-font); }
body, nav, .appearance { transition: background-color var(--cm-transition), color var(--cm-transition), border-color var(--cm-transition); }
nav { display: flex; align-items: center; gap: var(--cm-space-2); min-height: 76px; border-bottom: 1px solid var(--cm-border); padding: 0 var(--cm-space-2); }
.brand { font-size: 19px; font-weight: 650; letter-spacing: -.04em; white-space: nowrap; margin-right: auto; }
.links { display: flex; gap: var(--cm-space-2); align-items: center; }
button { display: inline-flex; align-items: center; justify-content: center; gap: var(--cm-space-2); min-height: 44px; min-width: 44px; padding: 0 var(--cm-space-3); border: 0; border-radius: var(--cm-radius); background: transparent; color: var(--cm-muted); font: 500 13px var(--cm-font); cursor: pointer; transition: background var(--cm-transition), color var(--cm-transition), transform var(--cm-transition); }
button:hover { background: var(--cm-surface); color: var(--cm-text); transform: translateY(-1px); }
button[aria-current="page"] { background: var(--cm-accent-soft); color: var(--cm-accent); }
button:focus-visible { outline: 2px solid var(--cm-accent); outline-offset: 3px; }
.icon { font-size: 19px; line-height: 1; }
.appearance { border-left: 1px solid var(--cm-border); padding-left: var(--cm-space-2); }
.appearance button { width: 44px; padding: 0; }
.tip-wrap { position: relative; }
.tooltip { display: none; position: absolute; top: 48px; right: 0; padding: var(--cm-space-1) var(--cm-space-2); background: var(--cm-text); color: var(--cm-bg); border-radius: 6px; font-size: var(--cm-small); white-space: nowrap; z-index: 2; }
.tip-wrap:hover .tooltip, .tip-wrap:focus-within .tooltip { display: block; }
@media(max-width: 520px) { .brand { font-size: 17px; } .label { display: none; } nav, .links { gap: var(--cm-space-1); } button { padding: 0; width: 44px; } .appearance { padding-left: var(--cm-space-1); } }
@media(prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
.brand { color: var(--cm-text); font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 700; padding: 0; }
.brand-symbol { color: #14715a; font-size: 36px; margin-right: 8px; }
nav { min-height: 86px; padding: 0 14px; }
.links button { font-size: 15px; min-height: 48px; padding: 0 18px; border-radius: 15px; }
.links .icon { font-size: 23px; }
.appearance button { padding: 0; }
@media(max-width: 680px) { .brand { font-size: 17px; } .brand-symbol { font-size: 25px; margin-right: 0; } .links button { padding: 0; width: 36px; } nav { padding: 0; gap: 6px; } .label { display: none; } }
:root[data-page="logs"] nav { min-height: 66px; }
</style></head>
<body>
<nav aria-label="Main navigation"><button id="home" class="brand" aria-label="CodeMentor-LLM home"><span class="brand-symbol" aria-hidden="true">&lt;/&gt;</span>Code Mentor LLM</button><div class="links">
<div class="tip-wrap"><button id="workspace" aria-label="Workspace" aria-current="page"><span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="3" width="6" height="6" rx="1"/><rect x="3" y="15" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/></svg></span><span class="label">Workspace</span></button></div>
<div class="tip-wrap"><button id="logs" aria-label="Request Log"><span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h12M9 12h12M9 19h12"/><path d="M2 5h2M2 12h2M2 19h2"/></svg></span><span class="label">Request Log</span></button></div>
<div><button id="logout" aria-label="Log out"><span class="icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6a3 3 0 00-3 3v10a3 3 0 003 3h4m5-13 5 5-5 5M9 12h12"/></svg></span><span class="label">Log out</span></button></div>
<div class="appearance tip-wrap"><button id="appearance" aria-label="Appearance"><span class="icon" aria-hidden="true">◐</span></button></div>
</div></nav>
<script>
(() => {
  let page = 'workspace';
  let appearance = 'light';
  let revision = 0;
  let pendingRevision = 0;
  let inFlight = null;
  let confirmed = {page, appearance};
  let sendTimer;
  let queuedChange = false;
  const send = (type, payload = {}) => window.parent.postMessage({isStreamlitMessage: true, type, ...payload}, '*');
  let lastFrameHeight = null;
  const syncFrameHeight = () => {
    const height = page === 'logs' ? 80 : 108;
    if (height === lastFrameHeight) return;
    lastFrameHeight = height;
    send('streamlit:setFrameHeight', {height});
  };
  const render = () => {
    document.documentElement.dataset.page = page;
    document.documentElement.style.colorScheme = appearance;
    for (const id of ['workspace', 'logs']) {
      const button = document.getElementById(id);
      if (id === page) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    }
  };
  const applyAppearance = () => {
    // This local component is served from the app's own origin. Update both
    // documents in the same task rather than waiting for a Python round trip.
    try {
      const appRoot = window.parent.document.documentElement;
      if (appRoot.dataset.cmTheme !== appearance) {
        appRoot.style.setProperty('--cm-appearance', appearance);
        appRoot.style.colorScheme = appearance;
        appRoot.dataset.cmTheme = appearance;
      }
    } catch {
      // Cross-origin embeds wait for the server acknowledgement instead.
      return false;
    }
    document.documentElement.style.colorScheme = appearance;
    return true;
  };
  const emit = () => {
    if (inFlight) return;
    if (page === confirmed.page && appearance === confirmed.appearance) {
      queuedChange = false;
      return;
    }
    queuedChange = false;
    pendingRevision = ++revision;
    inFlight = {page, appearance, revision};
    send('streamlit:setComponentValue', {value: inFlight});
  };
  const queueChange = () => {
    queuedChange = true;
    clearTimeout(sendTimer);
    sendTimer = setTimeout(emit, 80);
  };
  window.addEventListener('message', event => {
    if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
    const acknowledged = event.data.args.ack_revision || 0;
    revision = Math.max(revision, acknowledged);
    // An older rerun can arrive while a new selection is being acknowledged.
    if (acknowledged < pendingRevision) return;
    const hasQueuedChange = queuedChange || (inFlight && (page !== inFlight.page || appearance !== inFlight.appearance));
    confirmed = {page: event.data.args.page, appearance: event.data.args.appearance};
    inFlight = null;
    pendingRevision = 0;
    document.documentElement.dataset.revision = String(acknowledged);
    if (!hasQueuedChange) {
      page = confirmed.page;
      appearance = confirmed.appearance;
    }
    applyAppearance();
    render();
    syncFrameHeight();
    if (hasQueuedChange) queueChange();
  });
  document.getElementById('home').onclick = () => {
    page = 'home'; render(); queueChange();
  };
  document.getElementById('workspace').onclick = () => {
    if (page === 'workspace') return;
    page = 'workspace'; render(); queueChange();
  };
  document.getElementById('logs').onclick = () => {
    if (page === 'logs') return;
    page = 'logs'; render(); queueChange();
  };
  document.getElementById('logout').onclick = () => {
    page = 'logout'; render(); queueChange();
  };
  document.getElementById('appearance').onclick = () => {
    appearance = appearance === 'dark' ? 'light' : 'dark';
    applyAppearance();
    queueChange();
  };
  send('streamlit:componentReady', {apiVersion: 1});
  syncFrameHeight();
})();
</script></body></html>
