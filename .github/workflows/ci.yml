name: CodeMentor-LLM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint 
        run: ruff check backend/src backend/api --ignore E501,F401,F541,E402
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          pip install fastapi uvicorn sqlalchemy pydantic python-dotenv requests pandas

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          USE_LOCAL_MODEL: "false"
          MODAL_ENDPOINT: "https://moizishere-droid--codementor-llm-generate-endpoint.modal.run"